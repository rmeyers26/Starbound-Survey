<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the game draw under phone notches; we keep controls clear with CSS safe-area insets later. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Starbound Survey</title>
    <meta
      name="description"
      content="A 3D astronomy exploration game: scan real objects to learn real science."
    />
    <!-- Colour of the browser bar on Android and of the status bar when installed. -->
    <meta name="theme-color" content="#05070f" />
    <!-- iPhone: these make "Add to Home Screen" open the game full screen like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Starbound" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
  </head>
  <body>
    <!-- #app is the single container the game draws into. -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

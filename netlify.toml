# Netlify settings. Netlify reads this file automatically on every deploy, so the build
# is the same for everyone (not dependent on settings clicked into a web page).

[build]
  command = "npm run build"   # type-checks, then builds the game with Vite
  publish = "dist"            # the folder Vite writes the finished game into

[build.environment]
  # Match the Node version used by CI (.github/workflows/ci.yml) so "works in CI" means "works on Netlify".
  NODE_VERSION = "22"

# --- Caching rules -------------------------------------------------------------------------------
# The service worker file and the page itself must ALWAYS be re-checked, or players would never
# receive an update. (Netlify's default is already "revalidate", but stating it makes it explicit
# and protects us if the default ever changes.)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Everything Vite puts in /assets/ has a content hash in its name (moon-2k-ab12cd.jpg), so a changed
# file always gets a new name. That makes it safe to cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Basic security headers ----------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
